name: arrow-cache-demo
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pandas>=2.0
  - pyarrow>=14.0
  - numpy>=1.24
  - pip
  - jupyter
  - ipython
  - pip:
    # Core ML and PyTorch dependencies
    - torch>=2.0.0
    - torchvision>=0.15.0
    - transformers>=4.30.0
    - datasets>=2.14.0
    # Iceberg and cloud storage
    - pyiceberg>=0.6.0
    - boto3>=1.28.0
    - s3fs>=2023.1.0
    # Training and monitoring
    - tqdm>=4.65.0
    - wandb>=0.15.0
    - tensorboard>=2.14.0
    # Utilities and misc
    - python-dotenv>=1.0.0
    - pyyaml>=6.0
    - requests>=2.31.0
    - packaging>=21.0
    # gRPC dependencies
    - grpcio>=1.50.0
    - grpcio-tools>=1.50.0
