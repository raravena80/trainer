# Patch for LeaderWorkerSet to use IRSA instead of AWS credentials
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: arrow-cache-lws
  namespace: arrow-cache
spec:
  leaderWorkerTemplate:
    leaderTemplate:
      spec:
        serviceAccountName: aws-service-account
        containers:
        - name: head
          env:
          - name: AWS_ACCESS_KEY_ID
            $patch: delete
          - name: AWS_SECRET_ACCESS_KEY
            $patch: delete
          - name: AWS_SESSION_TOKEN
            $patch: delete
    workerTemplate:
      spec:
        serviceAccountName: aws-service-account
        containers:
        - name: worker
          env:
          - name: AWS_ACCESS_KEY_ID
            $patch: delete
          - name: AWS_SECRET_ACCESS_KEY
            $patch: delete
          - name: AWS_SESSION_TOKEN
            $patch: delete
