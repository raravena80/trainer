apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainingRuntime
metadata:
  name: torch-simple
  namespace: arrow-cache-imdb
spec:
  template:
    spec:
      replicatedJobs:
      - name: worker
        template:
          spec:
            template:
              spec:
                restartPolicy: Never
                serviceAccount: aws-service-account
                containers:
                - name: trainer
                  image: python:3.11-slim
                  command:
                  - /bin/bash
                  - -c
                  args:
                  - |
                    # Default command - will be overridden by TrainJob
                    echo "Running training..."
                  env:
                  - name: AWS_DEFAULT_REGION
                    value: "us-east-1"
                  - name: TOKENIZERS_PARALLELISM
                    value: "false"
                  resources:
                    requests:
                      cpu: "500m"
                      memory: "1Gi"
                    limits:
                      cpu: "1"
                      memory: "2Gi"
                  volumeMounts:
                  - name: training-scripts
                    mountPath: /scripts
                    readOnly: true
                volumes:
                - name: training-scripts
                  configMap:
                    name: imdb-training-script
