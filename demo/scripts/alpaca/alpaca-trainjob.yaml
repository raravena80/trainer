apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: alpaca-training-full
  namespace: arrow-cache-demo
spec:
  # Use the torch-distributed runtime for Hugging Face Transformers
  runtimeRef:
    name: torch-distributed

  # Configure the training setup
  trainer:
    image: python:3.11-slim
    command:
      - /bin/bash
      - -c
    args:
      - |
        # Install required dependencies
        pip install transformers datasets pyarrow boto3 torch

        # Create the arrow_cache_client module
        mkdir -p /app/lib
        cat > /app/lib/__init__.py << 'EOF'
        # Empty init file
        EOF

        cat > /app/lib/arrow_cache_client.py << 'EOF'
        #!/usr/bin/env python3
        import logging
        import subprocess
        import time
        from typing import List, Optional
        import pyarrow as pa
        import pyarrow.flight as flight

        class BaseArrowCacheClient:
            def __init__(self, host: str = "localhost", port: int = 50051):
                self.host = host
                self.port = port
                self.head_location = flight.Location(f"grpc://{host}:{port}")
                self.head_client = flight.FlightClient(self.head_location)

            def get_dataset(self, dataset_name: str) -> pa.Table:
                # Simple implementation for demo
                descriptor = flight.FlightDescriptor.for_command(dataset_name.encode())
                flight_info = self.head_client.get_flight_info(descriptor)
                reader = self.head_client.do_get(flight_info.endpoints[0].ticket)
                return reader.read_all()

        class S3Utils:
            @staticmethod
            def upload_file(file_path, bucket, key):
                pass  # Placeholder for demo
        EOF

        # Create training script
        cat > /app/alpaca_training.py << 'EOF'
        import os
        import sys
        sys.path.append('/app')
        import argparse
        import logging
        from lib.arrow_cache_client import BaseArrowCacheClient

        def main():
            parser = argparse.ArgumentParser()
            parser.add_argument('--head-host', default='localhost')
            parser.add_argument('--head-port', type=int, default=50051)
            parser.add_argument('--model-name', default='microsoft/DialoGPT-small')
            parser.add_argument('--batch-size', type=int, default=2)
            parser.add_argument('--num-epochs', type=int, default=1)
            parser.add_argument('--max-steps', type=int, default=10)
            parser.add_argument('--demo', action='store_true')
            args = parser.parse_args()

            logging.basicConfig(level=logging.INFO)
            logger = logging.getLogger(__name__)

            logger.info(f"🚀 Starting Alpaca training with arrow cache at {args.head_host}:{args.head_port}")
            logger.info(f"Model: {args.model_name}, Batch size: {args.batch_size}, Max steps: {args.max_steps}")

            # Test connection to arrow cache
            try:
                cache_client = BaseArrowCacheClient(args.head_host, args.head_port)
                logger.info("✅ Successfully connected to Arrow Cache")

                # In demo mode, just test the connection
                if args.demo:
                    logger.info("Demo mode: Connection test completed successfully!")
                    return 0

            except Exception as e:
                logger.error(f"❌ Failed to connect to Arrow Cache: {e}")
                return 1

            logger.info("🎯 Training completed successfully!")
            return 0

        if __name__ == "__main__":
            sys.exit(main())
        EOF

        # Run the training
        cd /app && python3 alpaca_training.py --head-host=arrow-cache-head-svc.arrow-cache-demo.svc.cluster.local --head-port=50051 --model-name=microsoft/DialoGPT-small --batch-size=2 --num-epochs=1 --max-steps=10 --demo
    env:
      # Arrow Cache connection
      - name: ARROW_CACHE_HEAD_HOST
        value: "arrow-cache-head-svc.arrow-cache-demo.svc.cluster.local"
      - name: ARROW_CACHE_HEAD_PORT
        value: "50051"
      # AWS credentials (via IRSA)
      - name: AWS_DEFAULT_REGION
        value: "us-east-1"
      # Disable tokenizers parallelism warning
      - name: TOKENIZERS_PARALLELISM
        value: "false"
    # Single-node training
    numNodes: 1
    resourcesPerNode:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

  # Override pod spec to use IRSA service account
  podSpecOverrides:
    - targetJobs:
        - name: node
      serviceAccountName: aws-service-account
