apiVersion: v1
data:
  alpaca_training.py: "#!/usr/bin/env python3
  lib/__init__.py: |
    # Arrow Cache Demo Library
  lib/arrow_cache_client.py: |\n\"\"\"\nAlpaca Dataset Training Script
    with Arrow Cache Integration\n\nThis script trains a language model on the Alpaca
    dataset using:\n1. Arrow Cache for distributed data access\n2. PyTorch/Transformers
    for model training\n3. Iceberg for experiment logging\n4. Real Alpaca instruction-following
    data\n\nSchema of Alpaca dataset:\n- instruction: The instruction given to the
    model\n- input: Additional input context (optional)\n- output: The expected output\n-
    text: Combined formatted text for training\n\"\"\"\n\nimport os\nimport sys\nimport
    io\nimport json\nimport time\nimport hashlib\nimport platform\nimport subprocess\nimport
    argparse\nimport logging\nfrom datetime import datetime, timezone\nfrom typing
    import Dict, List, Optional\n\n# Disable tokenizers parallelism warning\nos.environ[\"TOKENIZERS_PARALLELISM\"]
    = \"false\"\n\nimport boto3\nimport torch\nfrom torch import nn, optim\nfrom torch.utils.data
    import DataLoader, Dataset\nfrom transformers import (\n    AutoTokenizer, AutoModelForCausalLM,
    \n    TrainingArguments, Trainer,\n    DataCollatorForLanguageModeling\n)\nimport
    pyarrow as pa\nimport pyarrow.flight as flight\nimport pyarrow.parquet as pq\n\n#
    Add the lib directory to the Python path for Arrow Cache client\nsys.path.append(os.path.join(os.path.dirname(__file__),
    '..', 'lib'))\nfrom arrow_cache_client import BaseArrowCacheClient, S3Utils\n\nfrom
    pyiceberg.catalog import load_catalog\nfrom pyiceberg.schema import Schema, NestedField\nfrom
    pyiceberg.types import (\n    StringType, FloatType, LongType, TimestampType,\n
    \   ListType, MapType\n)\nfrom pyiceberg.partitioning import PartitionSpec\n#
    Import will be done locally where needed\n\n# Configure logging\nlogging.basicConfig(level=logging.INFO,
    format='%(asctime)s - %(levelname)s - %(message)s')\nlogger = logging.getLogger(__name__)\n\n#
    ===================== Configuration =====================\nAWS_PROFILE = \"root-ricardo\"\nAWS_REGION
    = \"us-east-1\"\nGLUE_DB = \"hf_datasets\"\nRUNS_TABLE = \"alpaca_training_runs\"\n\n#
    Iceberg warehouse for training logs\nWAREHOUSE_S3 = \"s3://ricardo.hf.datasets/iceberg-warehouse\"\n\n#
    Model checkpoints\nCKPT_BUCKET = \"ricardo.hf.datasets\"\nCKPT_PREFIX = \"alpaca_models\"\n\n#
    Training configuration\nEPOCHS = 1\nBATCH_SIZE = 4  # Small batch size for demo\nLR
    = 5e-5\nSEED = 42\nMAX_LENGTH = 512\nGRADIENT_ACCUMULATION_STEPS = 4\n\n# Arrow
    Cache configuration  \nARROW_CACHE_HOST = \"localhost\"\nARROW_CACHE_PORT = 50051\nARROW_CACHE_NAMESPACE
    = \"arrow-cache-demo\"\n# =======================================================\n\n\nclass
    AlpacaArrowCacheClient(BaseArrowCacheClient):\n    \"\"\"Arrow Cache client specialized
    for Alpaca dataset.\"\"\"\n    \n    def __init__(self, host: str = \"localhost\",
    port: int = 50051):\n        super().__init__(host, port)\n        self.namespace
    = ARROW_CACHE_NAMESPACE\n        \n    def process_query_result(self, result:
    pa.Table, description: str):\n        \"\"\"Process Alpaca-specific query results.\"\"\"\n
    \       if len(result) > 0:\n            self.logger.info(f\"Retrieved {len(result)}
    Alpaca samples\")\n            self.logger.info(f\"Columns: {result.column_names}\")\n
    \           \n            # Show sample data\n            df = result.to_pandas()\n
    \           if len(df) > 0:\n                sample = df.iloc[0]\n                self.logger.info(\"===
    Sample Alpaca Entry ===\")\n                self.logger.info(f\"Instruction: {sample.get('instruction',
    'N/A')[:100]}...\")\n                self.logger.info(f\"Input: {sample.get('input',
    'N/A')[:50]}...\")\n                self.logger.info(f\"Output: {sample.get('output',
    'N/A')[:100]}...\")\n        return result\n\n    def get_alpaca_data(self, num_partitions:
    int = 4) -> pa.Table:\n        \"\"\"Retrieve Alpaca data from Arrow Cache.\"\"\"\n
    \       self.logger.info(f\"Fetching Alpaca data from Arrow Cache...\")\n        \n
    \       all_data = []\n        \n        for partition_id in range(num_partitions):\n
    \           try:\n                self.logger.info(f\"Fetching partition {partition_id}/{num_partitions}\")\n
    \               \n                flight_info = self.get_flight_info_for_partition(partition_id,
    num_partitions)\n                \n                if flight_info.endpoints:\n
    \                   for endpoint in flight_info.endpoints:\n                        if
    endpoint.locations and endpoint.ticket:\n                            worker_uri
    = self.translate_worker_uri(\n                                endpoint.locations[0].uri,
    self.namespace\n                            )\n                            \n
    \                           self.logger.info(f\"Querying worker at {worker_uri}\")\n
    \                           \n                            try:\n                                worker_location
    = flight.Location(worker_uri)\n                                worker_client =
    flight.FlightClient(worker_location)\n                                \n                                flight_stream
    = worker_client.do_get(endpoint.ticket)\n                                partition_data
    = flight_stream.read_all()\n                                \n                                self.logger.info(f\"Retrieved
    {len(partition_data)} rows from partition {partition_id}\")\n                                all_data.append(partition_data)\n
    \                               break\n                                \n                            except
    Exception as e:\n                                self.logger.warning(f\"Failed
    to query worker {worker_uri}: {e}\")\n                                continue\n
    \                               \n            except Exception as e:\n                self.logger.warning(f\"Failed
    to get flight info for partition {partition_id}: {e}\")\n                continue\n
    \               \n            time.sleep(0.5)  # Small delay between partitions\n
    \       \n        if all_data:\n            # Concatenate all partition data\n
    \           combined_data = pa.concat_tables(all_data)\n            self.logger.info(f\"Total
    Alpaca samples retrieved: {len(combined_data)}\")\n            return combined_data\n
    \       else:\n            raise RuntimeError(\"Failed to retrieve any data from
    Arrow Cache\")\n\n\nclass AlpacaDataset(Dataset):\n    \"\"\"PyTorch Dataset for
    Alpaca instruction-following data.\"\"\"\n    \n    def __init__(self, arrow_table:
    pa.Table, tokenizer, max_length: int = 512):\n        self.data = arrow_table.to_pandas()\n
    \       self.tokenizer = tokenizer\n        self.max_length = max_length\n        \n
    \       # Filter out entries without required fields\n        required_fields
    = ['instruction', 'output']\n        for field in required_fields:\n            if
    field not in self.data.columns:\n                raise ValueError(f\"Missing required
    field: {field}\")\n        \n        # Remove rows with null values in critical
    fields\n        self.data = self.data.dropna(subset=required_fields)\n        logger.info(f\"Filtered
    dataset size: {len(self.data)} samples\")\n    \n    def __len__(self):\n        return
    len(self.data)\n    \n    def __getitem__(self, idx):\n        row = self.data.iloc[idx]\n
    \       \n        # Format the instruction-following prompt\n        instruction
    = row['instruction']\n        input_text = row.get('input', '')\n        output
    = row['output']\n        \n        if input_text.strip():\n            prompt
    = f\"### Instruction:\\n{instruction}\\n\\n### Input:\\n{input_text}\\n\\n###
    Response:\\n{output}\"\n        else:\n            prompt = f\"### Instruction:\\n{instruction}\\n\\n###
    Response:\\n{output}\"\n        \n        # Tokenize\n        encoding = self.tokenizer(\n
    \           prompt,\n            truncation=True,\n            padding='max_length',\n
    \           max_length=self.max_length,\n            return_tensors='pt'\n        )\n
    \       \n        return {\n            'input_ids': encoding['input_ids'].squeeze(),\n
    \           'attention_mask': encoding['attention_mask'].squeeze(),\n            'labels':
    encoding['input_ids'].squeeze()  # For causal LM, labels = input_ids\n        }\n\n\ndef
    git_commit_hash():\n    try:\n        return subprocess.check_output([\"git\",
    \"rev-parse\", \"HEAD\"], stderr=subprocess.DEVNULL).decode().strip()\n    except
    Exception:\n        return \"unknown\"\n\n\ndef sha256_bytesio(buf: io.BytesIO)
    -> str:\n    h = hashlib.sha256()\n    h.update(buf.getbuffer())\n    return h.hexdigest()\n\n\ndef
    ensure_glue_db(session, name: str):\n    glue = session.client(\"glue\", region_name=AWS_REGION)\n
    \   try:\n        glue.get_database(Name=name)\n        logger.info(f\"Glue database
    '{name}' exists.\")\n    except glue.exceptions.EntityNotFoundException:\n        logger.info(f\"Creating
    Glue database '{name}'...\")\n        glue.create_database(DatabaseInput={\"Name\":
    name})\n        logger.info(\"Created.\")\n\n\ndef ensure_bucket(session, bucket:
    str):\n    s3 = session.client(\"s3\", region_name=AWS_REGION)\n    try:\n        s3.head_bucket(Bucket=bucket)\n
    \       logger.info(f\"S3 bucket '{bucket}' exists.\")\n    except Exception:\n
    \       raise RuntimeError(f\"S3 bucket '{bucket}' does not exist or is not accessible.\")\n\n\ndef
    build_runs_schema() -> Schema:\n    \"\"\"Build schema for training runs logging.\"\"\"\n
    \   field_id = 1\n    def F(name, typ, required=False):\n        nonlocal field_id\n
    \       nf = NestedField(field_id, name, typ, required=required)\n        field_id
    += 1\n        return nf\n\n    # Helper for map types\n    def create_map_type():\n
    \       nonlocal field_id\n        key_id = field_id\n        field_id += 1\n
    \       value_id = field_id  \n        field_id += 1\n        return MapType(\n
    \           key_id=key_id,\n            key_type=StringType(),\n            value_id=value_id,\n
    \           value_type=StringType(),\n            value_required=False\n        )\n\n
    \   return Schema(\n        F(\"run_id\", StringType(), True),\n        F(\"timestamp\",
    TimestampType()),\n        F(\"model_name\", StringType()),\n        F(\"dataset\",
    StringType()),\n        F(\"train_size\", LongType()),\n        F(\"epochs\",
    LongType()),\n        F(\"batch_size\", LongType()),\n        F(\"lr\", FloatType()),\n
    \       F(\"max_length\", LongType()),\n        F(\"seed\", LongType()),\n        F(\"train_loss\",
    FloatType()),\n        F(\"duration_sec\", FloatType()),\n        F(\"checkpoint_uri\",
    StringType()),\n        F(\"checkpoint_sha256\", StringType()),\n        F(\"git_commit\",
    StringType()),\n        F(\"env\", create_map_type()),\n        F(\"hparams\",
    create_map_type()),\n        F(\"arrow_cache_used\", StringType()),  # Whether
    Arrow Cache was used\n    )\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=\"Train
    model on Alpaca dataset using Arrow Cache\")\n    parser.add_argument(\"--model-name\",
    default=\"microsoft/DialoGPT-small\", help=\"Model to use for training\")\n    parser.add_argument(\"--use-arrow-cache\",
    action=\"store_true\", help=\"Use Arrow Cache for data loading\")\n    parser.add_argument(\"--max-samples\",
    type=int, default=1000, help=\"Maximum samples to use for training\")\n    parser.add_argument(\"--dry-run\",
    action=\"store_true\", help=\"Run without actual training\")\n    parser.add_argument(\"--skip-checkpoint\",
    action=\"store_true\", help=\"Skip saving checkpoint to S3 (for testing)\")\n
    \   \n    args = parser.parse_args()\n    \n    # Set seeds for reproducibility\n
    \   torch.manual_seed(SEED)\n    \n    logger.info(\"\U0001F680 Starting Alpaca
    training with Arrow Cache integration\")\n    logger.info(f\"Model: {args.model_name}\")\n
    \   logger.info(f\"Use Arrow Cache: {args.use_arrow_cache}\")\n    logger.info(f\"Max
    samples: {args.max_samples}\")\n    \n    # AWS session\n    session = boto3.Session(profile_name=AWS_PROFILE,
    region_name=AWS_REGION)\n    ensure_bucket(session, CKPT_BUCKET)\n    ensure_glue_db(session,
    GLUE_DB)\n    \n    # Initialize tokenizer and model\n    logger.info(\"Loading
    tokenizer and model...\")\n    tokenizer = AutoTokenizer.from_pretrained(args.model_name)\n
    \   if tokenizer.pad_token is None:\n        tokenizer.pad_token = tokenizer.eos_token\n
    \   \n    model = AutoModelForCausalLM.from_pretrained(args.model_name)\n    logger.info(f\"Model
    loaded: {model.config.name_or_path}\")\n    \n    # Load data\n    if args.use_arrow_cache:\n
    \       logger.info(\"\U0001F4CA Loading data from Arrow Cache...\")\n        try:\n
    \           cache_client = AlpacaArrowCacheClient(ARROW_CACHE_HOST, ARROW_CACHE_PORT)\n
    \           cache_client.connect()\n            \n            # Get data from
    cache\n            arrow_data = cache_client.get_alpaca_data()\n            \n
    \           # Limit samples if specified\n            if args.max_samples and
    len(arrow_data) > args.max_samples:\n                # Take a random sample\n
    \               import random\n                indices = random.sample(range(len(arrow_data)),
    args.max_samples)\n                arrow_data = arrow_data.take(indices)\n                logger.info(f\"Using
    {len(arrow_data)} samples (limited from full dataset)\")\n                \n            dataset
    = AlpacaDataset(arrow_data, tokenizer, MAX_LENGTH)\n            data_source =
    \"arrow_cache\"\n            \n        except Exception as e:\n            logger.error(f\"Failed
    to load from Arrow Cache: {e}\")\n            logger.info(\"Falling back to direct
    Iceberg access...\")\n            \n            # Fallback to direct Iceberg access\n
    \           from pyiceberg.catalog.glue import GlueCatalog\n            catalog
    = GlueCatalog(\n                name=\"glue_catalog\",\n                warehouse=WAREHOUSE_S3,\n
    \               profile_name=AWS_PROFILE,\n                region_name=AWS_REGION\n
    \           )\n            \n            table = catalog.load_table(\"hf_datasets.tatsu-lab_alpaca\")\n
    \           scan = table.scan()\n            arrow_data = scan.to_arrow()\n            \n
    \           if args.max_samples and len(arrow_data) > args.max_samples:\n                import
    random\n                indices = random.sample(range(len(arrow_data)), args.max_samples)\n
    \               arrow_data = arrow_data.take(indices)\n            \n            dataset
    = AlpacaDataset(arrow_data, tokenizer, MAX_LENGTH)\n            data_source =
    \"direct_iceberg\"\n    else:\n        logger.info(\"\U0001F4CA Loading data directly
    from Iceberg...\")\n        from pyiceberg.catalog.glue import GlueCatalog\n        catalog
    = GlueCatalog(\n            name=\"glue_catalog\",\n            warehouse=WAREHOUSE_S3,\n
    \           profile_name=AWS_PROFILE,\n            region_name=AWS_REGION\n        )\n
    \       \n        table = catalog.load_table(\"hf_datasets.tatsu-lab_alpaca\")\n
    \       scan = table.scan()\n        arrow_data = scan.to_arrow()\n        \n
    \       if args.max_samples and len(arrow_data) > args.max_samples:\n            import
    random\n            indices = random.sample(range(len(arrow_data)), args.max_samples)\n
    \           arrow_data = arrow_data.take(indices)\n        \n        dataset =
    AlpacaDataset(arrow_data, tokenizer, MAX_LENGTH)\n        data_source = \"direct_iceberg\"\n
    \   \n    # Create data loader\n    data_loader = DataLoader(dataset, batch_size=BATCH_SIZE,
    shuffle=True)\n    logger.info(f\"Dataset loaded: {len(dataset)} samples, {len(data_loader)}
    batches\")\n    \n    if args.dry_run:\n        logger.info(\"\U0001F9EA Dry run
    mode - skipping actual training\")\n        logger.info(f\"Would train on {len(dataset)}
    samples for {EPOCHS} epochs\")\n        return\n    \n    # Training setup\n    logger.info(\"\U0001F3CB️
    Setting up training...\")\n    optimizer = optim.AdamW(model.parameters(), lr=LR)\n
    \   \n    # Training loop\n    model.train()\n    total_loss = 0.0\n    step =
    0\n    \n    t0 = time.time()\n    logger.info(f\"\U0001F3AF Starting training
    for {EPOCHS} epochs...\")\n    \n    for epoch in range(EPOCHS):\n        epoch_loss
    = 0.0\n        for batch_idx, batch in enumerate(data_loader):\n            input_ids
    = batch['input_ids']\n            attention_mask = batch['attention_mask']\n            labels
    = batch['labels']\n            \n            # Forward pass\n            outputs
    = model(input_ids=input_ids, attention_mask=attention_mask, labels=labels)\n            loss
    = outputs.loss\n            \n            # Backward pass\n            loss =
    loss / GRADIENT_ACCUMULATION_STEPS\n            loss.backward()\n            \n
    \           step += 1\n            epoch_loss += loss.item()\n            total_loss
    += loss.item()\n            \n            if step % GRADIENT_ACCUMULATION_STEPS
    == 0:\n                optimizer.step()\n                optimizer.zero_grad()\n
    \           \n            if batch_idx % 10 == 0:\n                logger.info(f\"Epoch
    {epoch+1}/{EPOCHS}, Batch {batch_idx}/{len(data_loader)}, Loss: {loss.item():.4f}\")\n
    \       \n        avg_epoch_loss = epoch_loss / len(data_loader)\n        logger.info(f\"✅
    Epoch {epoch+1}/{EPOCHS} completed. Average loss: {avg_epoch_loss:.4f}\")\n    \n
    \   duration_sec = time.time() - t0\n    avg_train_loss = total_loss / (len(data_loader)
    * EPOCHS)\n    \n    logger.info(f\"\U0001F389 Training completed in {duration_sec:.2f}s.
    Average loss: {avg_train_loss:.4f}\")\n    \n    # Save model checkpoint\n    run_id
    = datetime.now(timezone.utc).strftime(\"%Y%m%d_%H%M%S\")\n    ckpt_key = f\"{CKPT_PREFIX}/alpaca_{args.model_name.replace('/',
    '_')}_{run_id}.pt\"\n    checkpoint_uri = f\"s3://{CKPT_BUCKET}/{ckpt_key}\"\n
    \   \n    if args.skip_checkpoint:\n        logger.info(\"\U0001F4BE Skipping
    checkpoint save (--skip-checkpoint specified)\")\n        ckpt_hash = \"skipped\"\n
    \   else:\n        logger.info(\"\U0001F4BE Preparing model checkpoint...\")\n
    \       \n        # Configure S3 client with shorter timeout\n        from botocore.config
    import Config\n        s3_config = Config(\n            connect_timeout=30,\n
    \           read_timeout=300,  # 5 minutes\n            retries={'max_attempts':
    3}\n        )\n        s3 = session.client(\"s3\", region_name=AWS_REGION, config=s3_config)\n
    \       \n        logger.info(\"\U0001F4BE Serializing model state...\")\n        ckpt_buf
    = io.BytesIO()\n        torch.save(model.state_dict(), ckpt_buf)\n        checkpoint_size_mb
    = len(ckpt_buf.getvalue()) / (1024 * 1024)\n        logger.info(f\"\U0001F4BE
    Checkpoint size: {checkpoint_size_mb:.1f} MB\")\n        \n        ckpt_buf.seek(0)\n
    \       ckpt_hash = sha256_bytesio(ckpt_buf)\n        ckpt_buf.seek(0)\n        \n
    \       logger.info(f\"\U0001F4BE Uploading checkpoint to s3://{CKPT_BUCKET}/{ckpt_key}...\")\n
    \       try:\n            s3.upload_fileobj(ckpt_buf, CKPT_BUCKET, ckpt_key)\n
    \           logger.info(f\"\U0001F4BE Checkpoint saved successfully: {checkpoint_uri}\")\n
    \       except Exception as e:\n            logger.error(f\"Failed to upload checkpoint:
    {e}\")\n            # Continue without checkpoint for now\n            ckpt_hash
    = \"upload_failed\"\n    \n    # Log training run to Iceberg\n    logger.info(\"\U0001F4DD
    Logging training run to Iceberg...\")\n    \n    # Environment info\n    env_map
    = {\n        \"python\": platform.python_version(),\n        \"platform\": platform.platform(),\n
    \       \"torch\": torch.__version__,\n    }\n    try:\n        import transformers\n
    \       env_map[\"transformers\"] = transformers.__version__\n    except Exception:\n
    \       pass\n    \n    # Hyperparameters\n    hparams_map = {\n        \"model_name\":
    args.model_name,\n        \"epochs\": str(EPOCHS),\n        \"batch_size\": str(BATCH_SIZE),\n
    \       \"lr\": str(LR),\n        \"max_length\": str(MAX_LENGTH),\n        \"seed\":
    str(SEED),\n        \"max_samples\": str(args.max_samples),\n    }\n    \n    #
    Prepare Arrow record - match Iceberg table schema exactly\n    arrow_schema =
    pa.schema([\n        pa.field(\"run_id\", pa.string(), nullable=False),  # Required
    field\n        pa.field(\"timestamp\", pa.timestamp(\"us\"), nullable=True),\n
    \       pa.field(\"model_name\", pa.string(), nullable=True),\n        pa.field(\"dataset\",
    pa.string(), nullable=True),\n        pa.field(\"train_size\", pa.int64(), nullable=True),\n
    \       pa.field(\"epochs\", pa.int64(), nullable=True),\n        pa.field(\"batch_size\",
    pa.int64(), nullable=True),\n        pa.field(\"lr\", pa.float32(), nullable=True),\n
    \       pa.field(\"max_length\", pa.int64(), nullable=True),\n        pa.field(\"seed\",
    pa.int64(), nullable=True),\n        pa.field(\"train_loss\", pa.float32(), nullable=True),\n
    \       pa.field(\"duration_sec\", pa.float32(), nullable=True),\n        pa.field(\"checkpoint_uri\",
    pa.string(), nullable=True),\n        pa.field(\"checkpoint_sha256\", pa.string(),
    nullable=True),\n        pa.field(\"git_commit\", pa.string(), nullable=True),\n
    \       pa.field(\"env\", pa.map_(pa.string(), pa.string()), nullable=True),\n
    \       pa.field(\"hparams\", pa.map_(pa.string(), pa.string()), nullable=True),\n
    \       pa.field(\"arrow_cache_used\", pa.string(), nullable=True),\n    ])\n
    \   \n    now = datetime.now(timezone.utc)\n    record_tbl = pa.Table.from_arrays([\n
    \       pa.array([run_id]),\n        pa.array([now], type=pa.timestamp(\"us\")),\n
    \       pa.array([args.model_name]),\n        pa.array([\"tatsu-lab_alpaca\"]),\n
    \       pa.array([len(dataset)], type=pa.int64()),\n        pa.array([EPOCHS],
    type=pa.int64()),\n        pa.array([BATCH_SIZE], type=pa.int64()),\n        pa.array([float(LR)],
    type=pa.float32()),\n        pa.array([MAX_LENGTH], type=pa.int64()),\n        pa.array([SEED],
    type=pa.int64()),\n        pa.array([float(avg_train_loss)], type=pa.float32()),\n
    \       pa.array([float(duration_sec)], type=pa.float32()),\n        pa.array([checkpoint_uri]),\n
    \       pa.array([ckpt_hash]),\n        pa.array([git_commit_hash()]),\n        pa.array([env_map],
    type=pa.map_(pa.string(), pa.string())),\n        pa.array([hparams_map], type=pa.map_(pa.string(),
    pa.string())),\n        pa.array([data_source]),\n    ], schema=arrow_schema)\n
    \   \n    # Save to Iceberg\n    catalog = load_catalog(\n        \"glue\",\n
    \       **{\n            \"type\": \"glue\",\n            \"profile_name\": AWS_PROFILE,\n
    \           \"region\": AWS_REGION,\n            \"warehouse\": WAREHOUSE_S3,\n
    \       },\n    )\n    \n    # Create runs table if needed\n    runs_schema =
    build_runs_schema()\n    runs_table_id = f\"{GLUE_DB}.{RUNS_TABLE}\"\n    \n    if
    not catalog.table_exists(runs_table_id):\n        logger.info(f\"Creating training
    runs table {runs_table_id}...\")\n        catalog.create_table(\n            identifier=runs_table_id,\n
    \           schema=runs_schema,\n            partition_spec=PartitionSpec()\n
    \       )\n    \n    runs_table = catalog.load_table(runs_table_id)\n    \n    #
    Save record\n    table_location = runs_table.location().rstrip(\"/\")\n    data_key
    = f\"data/run={run_id}.parquet\"\n    data_s3_uri = f\"{table_location}/{data_key}\"\n
    \   \n    buf = io.BytesIO()\n    pq.write_table(record_tbl, buf)\n    buf_size
    = buf.getbuffer().nbytes\n    buf.seek(0)\n    \n    # Create S3 client for logging
    data upload\n    s3_logging = session.client(\"s3\", region_name=AWS_REGION)\n
    \   loc_bucket, loc_prefix = table_location[5:].split(\"/\", 1)\n    s3_logging.upload_fileobj(buf,
    loc_bucket, f\"{loc_prefix}/{data_key}\")\n    \n    # Register with Iceberg using
