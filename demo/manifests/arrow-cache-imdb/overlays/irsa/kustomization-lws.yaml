apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Use the LeaderWorkerSet version of base arrow-cache-imdb manifests and add IRSA service account
resources:
- ../../namespace.yaml
- ../../configmap.yaml
- ../../arrow-cache-leaderworkerset.yaml
- aws-service-account.yaml

# Patch LeaderWorkerSet to add service account for IRSA
patches:
- path: lws-patch.yaml
  target:
    kind: LeaderWorkerSet
    name: arrow-cache-imdb-lws

patchesStrategicMerge:
- configmap-lws-patch.yaml

images:
- name: arrow-cache
  newTag: latest

commonLabels:
  app.kubernetes.io/name: arrow-cache-imdb
  app.kubernetes.io/part-of: trainer
  app.kubernetes.io/component: distributed-cache
