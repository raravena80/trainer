apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arrow-cache

resources:
- namespace.yaml
- configmap.yaml
- aws-secret.yaml
- worker-statefulset.yaml
- head-deployment.yaml

images:
- name: arrow-cache
  newTag: latest

commonLabels:
  app.kubernetes.io/name: arrow-cache
  app.kubernetes.io/part-of: trainer
  app.kubernetes.io/component: distributed-cache
