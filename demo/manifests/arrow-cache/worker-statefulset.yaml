apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arrow-cache-worker
  namespace: arrow-cache
  labels:
    app: arrow-cache-worker
    component: worker
spec:
  serviceName: "arrow-cache-worker-svc"
  replicas: 2
  selector:
    matchLabels:
      app: arrow-cache-worker
      component: worker
  template:
    metadata:
      labels:
        app: arrow-cache-worker
        component: worker
    spec:
      containers:
      - name: worker
        image: arrow-cache:latest
        imagePullPolicy: Never  # For local kind cluster
        command: ["/usr/local/bin/worker"]
        args: ["0.0.0.0", "50051"]
        ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
        env:
        - name: METADATA_LOC
          valueFrom:
            configMapKeyRef:
              name: arrow-cache-config
              key: METADATA_LOC
        - name: TABLE_NAME
          valueFrom:
            configMapKeyRef:
              name: arrow-cache-config
              key: TABLE_NAME
        - name: SCHEMA_NAME
          valueFrom:
            configMapKeyRef:
              name: arrow-cache-config
              key: SCHEMA_NAME
        - name: RUST_LOG
          valueFrom:
            configMapKeyRef:
              name: arrow-cache-config
              key: RUST_LOG
        - name: WORKER_RUNTIME
          valueFrom:
            configMapKeyRef:
              name: arrow-cache-config
              key: WORKER_RUNTIME
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              name: arrow-cache-config
              key: AWS_REGION
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
              optional: true
        - name: AWS_SESSION_TOKEN
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SESSION_TOKEN
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 50051
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: arrow-cache-worker-svc
  namespace: arrow-cache
  labels:
    app: arrow-cache-worker
    component: worker
spec:
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: arrow-cache-worker
    component: worker
  ports:
  - port: 50051
    targetPort: 50051
    protocol: TCP
    name: grpc
